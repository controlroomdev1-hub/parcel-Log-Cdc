<!doctype html>
<html lang="th">

  <style>
    :root {
      --bg: #f3f6f5;
      --panel: #ffffff;
      --ink: #182625;
      --muted: #62726f;
      --line: #d7e1df;
      --soft: #eef4f2;
      --brand: #106b5f;
      --brand-dark: #0a5148;
      --blue: #225f8f;
      --warn: #b9650f;
      --ok: #24783e;
      --danger: #aa3030;
      --shadow: 0 10px 24px rgba(23, 55, 50, .08);
    }

    * { box-sizing: border-box; }

    html {
      font-family: "Angsana New", "TH Sarabun New", "Segoe UI", Tahoma, sans-serif;
    }

    body {
      margin: 0;
      font-family: "Angsana New", "TH Sarabun New", "Segoe UI", Tahoma, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }

    button, input, select, textarea, table {
      font-family: "Angsana New", "TH Sarabun New", "Segoe UI", Tahoma, sans-serif;
    }

    button {
      border: 0;
      border-radius: 6px;
      min-height: 40px;
      padding: 9px 12px;
      background: var(--brand);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: var(--brand-dark); }
    button.secondary { background: #e7efed; color: var(--ink); }
    button.secondary:hover { background: #d9e6e3; }
    button.ghost { background: transparent; color: var(--blue); border: 1px solid #b8cbd5; }
    button.ghost:hover { background: #edf5f8; }
    button.danger { background: var(--danger); }

    input, select, textarea {
      width: 100%;
      border: 1px solid #c8d5d2;
      border-radius: 6px;
      padding: 10px 11px;
      background: #fff;
      color: var(--ink);
      outline: none;
    }

    textarea { min-height: 72px; resize: vertical; }

    input:focus, select:focus, textarea:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(16, 107, 95, .12);
    }

    header {
      background: #fff;
      border-bottom: 1px solid var(--line);
      padding: 16px clamp(14px, 4vw, 34px);
    }

      width: min(1360px, 100%);
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
